name: android-apk

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    tags: ['v*']              # git tag v0.1.0 && git push origin v0.1.0

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./featurefold
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config autoconf automake libtool lld libssl-dev build-essential

      - name: Install buildozer
        run: pip install numpy matplotlib buildozer cython

      - name: Bake level assets (also runs the scorer gates)
        run: python bake_assets.py

      - name: Cache SDK/NDK/Gradle between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          # Fixed: Added a hardcoded fallback string so the key input is never empty
          key: bz-cache-${{ hashFiles('featurefold/buildozer.spec') || 'default' }}
          restore-keys: |
            bz-cache-

      - name: Build APK
        run: buildozer --verbose android debug

      - uses: actions/upload-artifact@v4
        with:
          name: featurefold-apk
          path: featurefold/bin/*.apk
